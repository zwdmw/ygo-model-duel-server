name: Source Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - run: python -m pip install -r requirements-test.txt
      - run: python -m compileall -q room panel tools tests tournament pvp
      - run: node --check tournament/static/app.js
      - run: python tools/check_source.py
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s pvp -p 'test_*.py' -v
      - run: python -m unittest discover -s panel/ygo-tcp-bridge/app -p 'test_*.py' -v
      - run: python -m unittest outbound.test_outbound outbound.test_pool_refresh outbound.test_multiroom -v
        env:
          PYTHONPATH: room:room/admin:room/app-305m-admin-20260915
